name: 📅 周度 CIO 战略复盘 (每周日 20:00)

on:
  schedule:
    # UTC 12:00 周日 = 北京时间 周日 20:00
    - cron: '0 12 * * 0'
  workflow_dispatch: # 允许在 GitHub 网页/手机 App 上随时手动点击「Run workflow」立即生成周报

concurrency:
  group: weekly-cio-review
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 1. 检出坤哥的第二大脑仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '02_投资与分析/05_每日情报/scripts/requirements.txt'

      - name: 📦 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install -r "02_投资与分析/05_每日情报/scripts/requirements.txt"

      - name: 🧠 4. 运行周度 CIO 复盘引擎
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python "02_投资与分析/05_每日情报/scripts/run_weekly_review.py"

      - name: 💾 5. 提交并推送周报到 GitHub
        run: |
          git config user.name "Antigravity Investment Bot"
          git config user.email "bot@antigravity.local"
          git add "02_投资与分析/05_每日情报/"
          if git diff --staged --quiet; then
            echo "没有新增或变更的周报文件需要提交。"
          else
            git commit -m "📅 自动生成周度 CIO 战略复盘 ($(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
